services:
  jenkins-master:
    build: ./jenkins/master
    container_name: jenkins-master
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "115"
    networks:
      - jenkins-net

  jenkins-agent:
    build: ./jenkins/agent
    container_name: jenkins-agent
    profiles:
      - agent
    depends_on:
      - jenkins-master
    environment:
      - JENKINS_URL=http://jenkins-master:8080
      - JENKINS_AGENT_NAME=agent-1
      - JENKINS_SECRET=${JENKINS_AGENT_SECRET}
    networks:
      - jenkins-net

  jenkins-agent-deb:
    build: ./jenkins/agent-deb
    container_name: jenkins-agent-deb
    profiles:
      - agent
    depends_on:
      - jenkins-master
    environment:
      - JENKINS_URL=http://jenkins-master:8080
      - JENKINS_AGENT_NAME=agent-2
      - JENKINS_SECRET=${JENKINS_AGENT_2_SECRET}
    networks:
      - jenkins-net

  nginx:
    image: nginx:stable
    container_name: jenkins-nginx
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - jenkins-master
    networks:
      - jenkins-net

volumes:
  jenkins_home:

networks:
  jenkins-net:
    driver: bridge

