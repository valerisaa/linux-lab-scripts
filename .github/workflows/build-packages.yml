
name: Build Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check Bash syntax
        run: bash -n count_files.sh

      - name: Test script execution
        run: |
          bash count_files.sh /etc
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          dnf install -y rpm-build rpmdevtools tar gzip zstd

      - name: Setup RPM build environment
        run: rpmdev-setuptree

      - name: Prepare sources
        run: |
          cp lab4-rpm/SOURCES/count-files-2.0.tar.gz ~/rpmbuild/SOURCES/
          cp lab4-rpm/SOURCES/count_files.1 ~/rpmbuild/SOURCES/
          cp lab4-rpm/SOURCES/count-files.conf ~/rpmbuild/SOURCES/

      - name: Copy spec file
        run: cp lab4-rpm/SPECS/count-files.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/count-files.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v5
        with:
          name: rpm-package
          path: ~/rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error

  build-deb:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts

      - name: Prepare build directory
        run: |
          mkdir -p build/count-files-1.0
          cp -a lab5-deb/. build/count-files-1.0/

      - name: Build DEB
        run: |
          cd build/count-files-1.0
          dpkg-buildpackage -us -uc -b

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v5
        with:
          name: deb-package-${{ matrix.os }}
          path: build/*.deb
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: [test-script, build-rpm, build-deb]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download RPM artifact
        uses: actions/download-artifact@v5
        with:
          name: rpm-package
          path: release

      - name: Download DEB artifact
        uses: actions/download-artifact@v5
        with:
          name: deb-package-ubuntu-24.04
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.rpm release/*.deb --title "Release ${GITHUB_REF_NAME}" --generate-notes --verify-tag
