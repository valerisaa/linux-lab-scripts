
name: Build Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          dnf install -y rpm-build rpmdevtools tar gzip

      - name: Setup RPM build environment
        run: rpmdev-setuptree

      - name: Prepare sources
        run: |
          cp lab4-rpm/SOURCES/count-files-2.0.tar.gz /root/rpmbuild/SOURCES/
          cp lab4-rpm/SOURCES/count_files.1 /root/rpmbuild/SOURCES/
          cp lab4-rpm/SOURCES/count-files.conf /root/rpmbuild/SOURCES/

      - name: Copy spec file
        run: cp lab4-rpm/SPECS/count-files.spec /root/rpmbuild/SPECS/

      - name: Build RPM
        run: rpmbuild -ba /root/rpmbuild/SPECS/count-files.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: /root/rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error

  build-deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          dnf install -y rpm-build rpmdevtools tar gzip zstd
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts

      - name: Prepare build directory
        run: |
          mkdir -p build/count-files-1.0
          cp -a lab5-deb/. build/count-files-1.0/

      - name: Build DEB
        run: |
          cd build/count-files-1.0
          dpkg-buildpackage -us -uc -b

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb
          if-no-files-found: error
